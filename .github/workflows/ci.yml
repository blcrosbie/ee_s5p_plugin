name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what QGIS 3.22 LTR ships; 3.12 is current QGIS.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        # The core and compatibility tests need no QGIS, which is the point of
        # keeping them free of Qt imports.
        run: python -m pytest tests -v --tb=short

      - name: Run tests without the optional h3 package
        # QGIS does not bundle h3, so the fallback tiling is what most users get.
        # It has to be as well tested as the H3 path.
        env:
          EE_PLUGIN_NO_H3: "1"
        run: python -m pytest tests --tb=short

      - name: Validate the plugin package
        run: python tools/package.py --validate

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format --check
        run: python -m ruff format --check .

  qgis:
    name: QGIS ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest release the metadata claims support for.
          - image: qgis/qgis:release-3_22
            label: "3.22 (Qt5, oldest claimed)"
          # The current long term release.
          - image: qgis/qgis:release-3_44
            label: "3.44 LTR (Qt5)"
          # QGIS 4.x, which is Qt6 only.
          - image: qgis/qgis:release-4_2
            label: "4.2 (Qt6)"
          # Tracks master, so it breaks here before it breaks for users.
          - image: qgis/qgis:latest
            label: "latest (Qt6)"
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Report the environment
        run: |
          python3 -c "from qgis.core import Qgis; print('QGIS', Qgis.QGIS_VERSION)"
          python3 -c "from qgis.PyQt.QtCore import QT_VERSION_STR, PYQT_VERSION_STR; print('Qt', QT_VERSION_STR, 'PyQt', PYQT_VERSION_STR)"
          python3 --version

      - name: Audit every QGIS and Qt symbol the plugin uses
        # Catches an API that was removed or an enum that moved, which is the
        # usual way a plugin breaks on a new QGIS.
        run: python3 tools/api_audit.py

      - name: Import the plugin and drive the dock widget
        # xvfb gives the widgets a display to be created on.
        run: xvfb-run -a python3 tools/smoke_test.py

  package:
    name: Build the plugin zip
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: error
