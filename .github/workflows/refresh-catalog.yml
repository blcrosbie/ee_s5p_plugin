name: Refresh catalog snapshot

# Google adds, retires and extends datasets continuously, and the snapshot that
# ships in the plugin is what a user sees before they press refresh.  This keeps
# it current without anyone remembering to.
on:
  schedule:
    # 04:10 UTC every Monday.
    - cron: "10 4 * * 1"
  workflow_dispatch:
    inputs:
      open_pull_request:
        description: "Open a pull request instead of committing to main"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements-dev.txt

      - name: Compare the bundled snapshot with the live catalog
        id: drift
        continue-on-error: true
        run: |
          python tools/refresh_catalog.py --check | tee check.log
          echo "changed=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Refresh the snapshot
        if: steps.drift.outcome == 'failure'
        run: python tools/refresh_catalog.py

      - name: Re-run the tests against the new snapshot
        if: steps.drift.outcome == 'failure'
        run: python -m pytest tests -q

      - name: Summarise
        if: steps.drift.outcome == 'failure'
        run: |
          {
            echo "## Catalog drift"
            echo '```'
            cat check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request
        if: steps.drift.outcome == 'failure'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "data: refresh the Earth Engine catalog snapshot"
          title: "Refresh the Earth Engine catalog snapshot"
          body-path: check.log
          branch: catalog-refresh
          delete-branch: true
          labels: catalog
          add-paths: ee_s5p_plugin/data/gee_catalog.json.gz
